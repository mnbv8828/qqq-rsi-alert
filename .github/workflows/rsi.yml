name: QQQ RSI Alert

on:
  schedule:
    # 미국장 정규시간: 한국시간 22:30~05:00 (서머타임)
    # 15분마다 실행
    - cron: "*/15 13-20 * * 1-5"

  workflow_dispatch:

jobs:
  rsi-check:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: QQQ RSI 확인
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python qqq_rsi_alert.py

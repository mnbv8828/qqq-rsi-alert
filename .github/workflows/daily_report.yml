name: US Stock Daily Report

on:
  schedule:
    # 한국시간 화~토요일 07:15 실행
    # GitHub Actions cron은 UTC 기준
    # KST 07:15 = UTC 전날 22:15
    # 서머타임/겨울시간과 관계없이 한국시간 07:15 고정
    - cron: "15 22 * * 1-5"

  workflow_dispatch:
    inputs:
      test_mode:
        description: "수동 테스트 모드"
        required: true
        default: false
        type: boolean

concurrency:
  group: us-stock-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run US Stock Daily Report
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || false }}

        run: |
          echo "========================================"
          echo "US Stock Daily Report"
          echo "========================================"
          echo "TEST_MODE=$TEST_MODE"
          echo "========================================"

          python main.py

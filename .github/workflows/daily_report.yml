name: QQQ Daily Report

on:
  schedule:
    - cron: "10 20 * * 1-5"
    - cron: "10 21 * * 1-5"

  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: QQQ 일일 리포트
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python daily_report.py

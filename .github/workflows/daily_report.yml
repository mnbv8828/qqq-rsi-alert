name: US Stock Daily Report

on:
  schedule:
    - cron: "37 5 * * *"
      timezone: "America/New_York"

  workflow_dispatch:
    inputs:
      test_mode:
        description: "수동 테스트 모드"
        required: true
        default: false
        type: boolean

concurrency:
  group: us-stock-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run US Stock Daily Report
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEST_MODE: "true"

        run: |
          echo "========================================"
          echo "US Stock Daily Report"
          echo "========================================"
          echo "TEST_MODE=$TEST_MODE"
          echo "========================================"

          python main.py

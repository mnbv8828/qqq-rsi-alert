name: US Stock Daily Report

on:
  schedule:
    # 조기폐장 대응
    # NYSE 13:00 마감 → 13:30 실행
    - cron: "30 13 * * 1-5"
      timezone: "America/New_York"

    # 정상장 마감 대응
    # NYSE 16:00 마감 → 16:30 실행
    - cron: "30 16 * * 1-5"
      timezone: "America/New_York"

  workflow_dispatch:
    inputs:
      test_mode:
        description: "수동 테스트 모드"
        required: true
        default: false
        type: boolean

concurrency:
  group: us-stock-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run US Stock Daily Report
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || false }}

        run: |
          echo "========================================"
          echo "US Stock Daily Report"
          echo "========================================"
          echo "TEST_MODE=$TEST_MODE"
          echo "========================================"

          python main.py

```yaml
name: US Stock Daily Report

on:

  schedule:

    # ========================================================
    # 미국장 마감 시간 자동 대응
    #
    # GitHub Actions는 UTC 기준
    #
    # 실제 NYSE 마감시간은 main.py에서
    # pandas_market_calendars로 다시 확인한다.
    # ========================================================

    # 서머타임: 14:10 NY
    # 겨울시간: 13:10 NY
    - cron: "10 18 * * 1-5"

    # 서머타임: 15:10 NY
    # 겨울시간: 14:10 NY
    - cron: "10 19 * * 1-5"

    # 서머타임: 16:10 NY
    # 겨울시간: 15:10 NY
    - cron: "10 20 * * 1-5"

    # 서머타임: 17:10 NY
    # 겨울시간: 16:10 NY
    - cron: "10 21 * * 1-5"

  # GitHub Actions에서 수동 실행
  workflow_dispatch:


jobs:

  daily-report:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Repository
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # Packages
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            yfinance \
            pandas_market_calendars


      # ======================================================
      # Run
      # ======================================================

      - name: Run US Stock Daily Report
        env:

          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |

          python main.py
```

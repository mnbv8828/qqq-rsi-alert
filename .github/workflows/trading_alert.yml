name: QQQ Daily Trading Report

on:
  schedule:
    # 미국장 마감 후 한국시간 05:10
    # 20:10 UTC
    - cron: "10 20 * * 1-5"

  workflow_dispatch:

jobs:
  run-trading-indicator:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TICKERS: QQQ

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance numpy

      - name: Run Trading Indicator
        run: |
          python main.py
